# Publishes the static kiera-anderson/ site to GitHub Pages.
# Unrelated to the golFrame app itself; it only ever touches that one folder.
name: Deploy Kiera Anderson site to Pages

on:
  push:
    branches: [main]
    paths:
      - "kiera-anderson/**"
      - ".github/workflows/kiera-anderson-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        # enablement: true turns Pages on for the repo if it is not already,
        # so no manual visit to Settings is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: kiera-anderson

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
